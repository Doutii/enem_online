<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENEM Online</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="card"><h1>ENEM Online</h1><p class="muted">Importe a prova e o gabarito em PDF. O sistema transforma o caderno em uma prova digital e corrige automaticamente.</p>{% with messages=get_flashed_messages() %}{% if messages %}<div class="alert">{{ messages[-1] }}</div>{% endif %}{% endwith %}<form action="{{ url_for('importar') }}" method="post" enctype="multipart/form-data"><label>PDF da prova</label><input type="file" name="prova" accept="application/pdf" required><label>PDF do gabarito</label><input type="file" name="gabarito" accept="application/pdf" required><label>Idioma das questões 1–5</label><select name="language"><option value="ingles">Inglês</option><option value="espanhol">Espanhol</option></select><button>Importar e começar</button></form><p class="small">V1: otimizado para o ENEM 2024, Caderno 1 Azul, 1º dia.</p></main></body></html>
