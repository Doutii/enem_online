<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENEM Online</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="exam"><header><div><strong>ENEM Online</strong><span class="muted"> — Caderno Azul</span></div><div id="progress"></div></header><form action="{{ url_for('responder') }}" method="post" id="examForm"><div id="questions">{% for q in exam.questions %}<section class="question" data-num="{{ q.numero }}"><h2>Questão {{ '%02d'|format(q.numero) }}</h2><img class="question-img" src="{{ url_for('question_asset', filename=q.imagem) }}" alt="Questão {{ q.numero }}"><div class="choices">{% for l in ['A','B','C','D','E'] %}<label><input type="radio" name="q{{ q.numero }}" value="{{ l }}" {% if answers.get(q.numero|string)==l %}checked{% endif %}> <b>{{ l }}</b></label>{% endfor %}</div><label class="chute-toggle"><input type="checkbox" name="chute_{{ q.numero }}" value="1" {% if q.numero in chutes %}checked{% endif %}> 🎯 Marcar como chute</label></section>{% endfor %}</div><div class="nav"><button type="button" id="prev">← Anterior</button><button type="button" id="next">Próxima →</button><button type="submit" name="finalizar" value="1" class="finish">Finalizar prova</button></div></form></main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
