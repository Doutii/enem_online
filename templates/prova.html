<!doctype html>
<html lang="pt-br">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENEM Online</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20261005-3"></head>
<body>
<main class="exam" data-current-question="{{ current_question }}" data-remaining="{{ remaining }}" data-paused="{{ 1 if paused else 0 }}">
<header class="exam-header">
  <div class="exam-header-left" style="position:absolute;left:22px;top:10px;display:flex;align-items:center;gap:12px;height:52px;">
    <div class="timer-stack" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:92px;">
      <div class="timer" id="timer">05:30:00</div>
      <span id="progress">1 / {{ exam.questions|length }}</span>
    </div>
    <form action="{{ url_for('pausar') }}" method="post" id="pauseForm" style="display:block!important;margin:0!important;padding:0!important;width:auto!important;">
      <button type="submit" id="pauseButton" style="display:inline-flex!important;visibility:visible!important;opacity:1!important;width:auto!important;height:40px!important;margin:0!important;padding:8px 14px!important;background:#667085!important;color:#fff!important;border:0!important;border-radius:10px!important;font:700 14px Inter,Segoe UI,Arial,sans-serif!important;cursor:pointer!important;white-space:nowrap!important;">⏸ Pausar</button>
    </form>
  </div>
  <div class="header-brand" style="white-space:nowrap;text-align:center;"><strong>ENEM Online</strong><span class="muted"> — Caderno Azul</span></div>
</header>

<div class="exam-layout">
  <aside class="question-map" id="questionMap">
    <div class="map-head"><strong>Questões</strong><button type="button" id="closeMap" class="map-close">×</button></div>
    <div class="map-legend"><span>✓ Respondida</span><span>🎯 Chute</span><span>— Vazia</span></div>
    <div class="question-grid">
      {% for q in exam.questions %}
      <button type="button" class="question-number" data-go="{{ loop.index0 }}" data-num="{{ q.numero }}">
        <span>{{ '%02d'|format(q.numero) }}</span><small>—</small>
      </button>
      {% endfor %}
    </div>
  </aside>

  <section class="exam-content">
    <div class="mobile-map-row"><button type="button" id="openMap" class="map-toggle">☰ Questões</button></div>

    <form action="{{ url_for('responder') }}" method="post" id="examForm">
      <div id="questions">
        {% for q in exam.questions %}
        <section class="question" data-num="{{ q.numero }}">
          <h2>Questão {{ '%02d'|format(q.numero) }}</h2>
          <div class="question-img-wrap"><img class="question-img" src="{{ url_for('question_asset', filename=q.imagem) }}" alt="Questão {{ q.numero }}"></div>
          <div class="choices">
            {% for l in ['A','B','C','D','E'] %}
            <label><input type="radio" name="q{{ q.numero }}" value="{{ l }}" {% if answers.get(q.numero|string)==l %}checked{% endif %}> <b>{{ l }}</b></label>
            {% endfor %}
          </div>
          <label class="chute-toggle"><input type="checkbox" name="chute_{{ q.numero }}" value="1" {% if q.numero in chutes %}checked{% endif %}> 🎯 Marcar como chute</label>
        </section>
        {% endfor %}
      </div>
      <div class="nav">
        <button type="button" id="prev">← Anterior</button>
        <button type="button" id="next">Próxima →</button>
        <button type="submit" name="finalizar" value="1" class="finish">Finalizar prova</button>
      </div>
    </form>
  </section>
</div>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
